services:
  sandbox:
    container_name: sandbox-platform-sandbox
    build:
      context: .
      dockerfile: docker/sandbox-image/Dockerfile
    ports:
      - "3000:3000"
      - "4001:4001"
    env_file:
      - .env
    environment:
      - WORKER_SECRET=${WORKER_SECRET:-dev-secret}
      - ORCHESTRATOR_URL=http://host.docker.internal:4000
      - WORKER_DEV=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist /app between restarts so agent edits survive
      - sandbox-app:/app
    restart: unless-stopped

volumes:
  sandbox-app:
